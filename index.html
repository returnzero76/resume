<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jihwan — Resume</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Apple SD Gothic Neo", "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f6f8;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 56px 48px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { color: #5c6270; line-height: 1.7; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4353c6;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Jihwan</h1>
    <p>이력서 페이지를 준비하고 있습니다.<br>곧 정식 내용으로 업데이트될 예정입니다.</p>
    <span class="badge">Coming Soon</span>
  </main>
</body>
</html>
