<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root,
:root[data-theme="dark"]{
  --canvas:#0d1117;
  --subtle:#161b22;
  --inset:#010409;
  --fg:#e6edf3;
  --muted:#8b949e;
  --border:#30363d;
  --border-soft:#21262d;
  --accent:#58a6ff;
  --green:#3fb950;
  --btn:#21262d;
  --btn-hover:#30363d;
  --chip-bg:rgba(110,118,129,.25);
  --tab:#fd8c73;
  --shadow:0 8px 24px rgba(1,4,9,.75);
  --hm0:#161b22; --hm1:#0e4429; --hm2:#006d32; --hm3:#26a641; --hm4:#39d353;
  --hairline:rgba(255,255,255,.05);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --canvas:#ffffff;
  --subtle:#f6f8fa;
  --inset:#f6f8fa;
  --fg:#1f2328;
  --muted:#59636e;
  --border:#d1d9e0;
  --border-soft:#d1d9e0;
  --accent:#0969da;
  --green:#1a7f37;
  --btn:#f6f8fa;
  --btn-hover:#eef1f4;
  --chip-bg:rgba(175,184,193,.2);
  --tab:#fd8c73;
  --shadow:0 8px 24px rgba(31,35,40,.16);
  --hm0:#ebedf0; --hm1:#9be9a8; --hm2:#40c463; --hm3:#30a14e; --hm4:#216e39;
  --hairline:rgba(27,31,36,.06);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{
  margin:0;
  background:var(--canvas);
  color:var(--fg);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  font-size:14px;
  line-height:1.6;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
:root{--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
img{max-width:100%}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#app:focus{outline:none}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--inset);padding:8px 14px;z-index:60;border-radius:0 0 6px 0}
.skip:focus{left:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- top bar ---------- */
.topbar{background:var(--inset);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
:root[data-theme="light"] .topbar{background:#f6f8fa}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:56px}
.mark{font-size:20px;line-height:1}
.crumb{font-size:14px;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb a{color:var(--fg)}
.crumb b{font-weight:600}
.crumb .sep{color:var(--muted);margin:0 4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--btn);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .12s ease}
.btn:hover{background:var(--btn-hover)}
.btn svg{fill:currentColor}

/* ---------- profile layout ---------- */
.profile{display:grid;grid-template-columns:296px minmax(0,1fr);gap:24px;padding:24px 0 64px;align-items:start}
.profile > *{min-width:0}
.side{position:sticky;top:80px;min-width:0}
.avatar{width:100%;height:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:50% 22%;border:1px solid var(--border);background:var(--subtle);display:block}
.name{font-size:26px;font-weight:600;line-height:1.25;margin-top:16px}
.login{font-size:20px;font-weight:300;color:var(--muted);line-height:1.25}
.role{margin-top:12px;font-size:14px;color:var(--fg)}
.bio{margin-top:8px;font-size:14px;color:var(--muted)}
.meta{margin:16px 0 0;display:grid;gap:6px}
.meta li{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted)}
.meta svg{fill:var(--muted);flex:none;margin-top:4px}
.meta a{color:var(--fg)}
.meta a:hover{color:var(--accent)}
.side-h{font-size:14px;font-weight:600;margin:20px 0 8px;padding-top:20px;border-top:1px solid var(--border)}
.orgs{display:flex;flex-wrap:wrap;gap:8px}
.org{min-width:34px;height:34px;padding:0 9px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:-.02em;background:var(--subtle);border:1px solid var(--border);color:var(--fg);cursor:default}
.edu{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- boxes ---------- */
.box{border:1px solid var(--border);border-radius:6px;background:var(--canvas);overflow:hidden}
.box-head{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--subtle);border-bottom:1px solid var(--border);font-size:14px;color:var(--muted)}
.box-head svg{fill:var(--muted)}
.box-head b{color:var(--fg);font-weight:600}
.box-body{padding:24px 32px}
.sec{margin-top:24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-head h2{font-size:14px;font-weight:600}
.sec-head .hint{font-size:12px;color:var(--muted)}

/* ---------- markdown ---------- */
.md{font-size:15px;line-height:1.75}
.md h2{font-size:22px;font-weight:600;padding-bottom:.3em;border-bottom:1px solid var(--border);margin:0 0 16px}
.md h2 + p{margin-top:0}
.md h3{font-size:17px;font-weight:600;margin:24px 0 8px}
.md p{margin:0 0 12px}
.md p:last-child{margin-bottom:0}
.md ul.bullets{list-style:disc;padding-left:22px;margin:0 0 12px}
.md ul.bullets li{margin:6px 0}
.md strong{font-weight:600;color:var(--fg)}
.md code{font-family:var(--mono);font-size:85%;background:var(--chip-bg);border-radius:6px;padding:.2em .4em}
.tbl-wrap{overflow-x:auto;margin:16px 0}
table.md-tbl{border-collapse:collapse;width:100%;font-size:13px}
table.md-tbl th,table.md-tbl td{border:1px solid var(--border);padding:8px 13px;text-align:left;vertical-align:top}
table.md-tbl th{background:var(--subtle);font-weight:600;white-space:nowrap}
table.md-tbl tr:nth-child(2n) td{background:var(--subtle)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 4px}
.stat{border:1px solid var(--border);border-radius:6px;padding:10px 12px;background:var(--subtle)}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--fg);line-height:1.3}
.stat span{font-size:11px;color:var(--muted)}

/* ---------- pinned ---------- */
.pins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pin{position:relative;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;background:var(--canvas);overflow:hidden;transition:border-color .12s ease}
.pin-name::after{content:"";position:absolute;inset:0}
.pin:hover{border-color:var(--muted)}
.pin-body{padding:16px;flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.pin-top{display:flex;align-items:center;gap:8px;min-width:0}
.pin-top svg{fill:var(--muted);flex:none}
.pin-name{color:var(--accent);font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin-name:hover{text-decoration:underline}
.chip{border:1px solid var(--border);border-radius:2em;padding:0 7px;font-size:12px;line-height:18px;color:var(--muted);white-space:nowrap;flex:none}
.pin-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pin-foot{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}
.lang{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--hairline)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);height:120px}
.strip.one{grid-template-columns:1fr}
.strip img{width:100%;height:100%;object-fit:cover;object-position:50% 0%;display:block;background:var(--subtle)}
.strip.one img{object-position:0% 0%}

/* ---------- heatmap ---------- */
.hm-scroll{overflow-x:auto;padding-bottom:4px}
.hm{min-width:640px;max-width:640px;margin:0 auto}
.brackets{position:relative;height:38px;margin-left:38px}
.brk{position:absolute;height:13px;border:1px solid var(--border);border-bottom:0;border-radius:4px 4px 0 0}
.brk span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--canvas);padding:0 5px;font-size:10px;line-height:16px;color:var(--muted);white-space:nowrap}
.brk.r0{top:2px}
.brk.r1{top:21px}
.hm-grid{display:grid;grid-template-columns:38px repeat(17,minmax(13px,1fr));gap:3px}
.hm-y{font-size:10px;color:var(--muted);text-align:center;font-family:var(--mono);letter-spacing:-.03em}
.hm-m{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-family:var(--mono)}
.cell{aspect-ratio:1;border-radius:2px;background:var(--hm0);box-shadow:inset 0 0 0 1px var(--hairline)}
.cell.l1{background:var(--hm1)}
.cell.l2{background:var(--hm2)}
.cell.l3{background:var(--hm3)}
.cell.l4{background:var(--hm4)}
.hm-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:12px;font-size:12px;color:var(--muted)}
.hm-legend .cell{width:11px;height:11px;aspect-ratio:auto;border-radius:2px}
.hm-note{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- repo list ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.fchip{background:transparent;border:1px solid var(--border);border-radius:2em;padding:3px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .12s ease}
.fchip:hover{background:var(--btn-hover)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--inset)}
:root[data-theme="light"] .fchip[aria-pressed="true"]{color:#fff}
.repo-list{border-top:1px solid var(--border);margin-top:16px}
.repo-row{display:flex;gap:16px;align-items:flex-start;padding:20px 0;border-bottom:1px solid var(--border)}
.rr-main{flex:1 1 auto;min-width:0}
.rr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rr-name{font-size:18px;font-weight:600;color:var(--accent)}
.rr-name:hover{text-decoration:underline}
.rr-desc{font-size:13px;color:var(--muted);margin-top:4px}
.rr-foot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.rr-side{flex:none;font-size:12px;color:var(--muted);font-family:var(--mono);padding-top:4px}
.empty{padding:32px 0;color:var(--muted);font-size:13px;text-align:center}

/* ---------- repo detail ---------- */
.repo-head{padding:16px 0 0;border-bottom:1px solid var(--border)}
.repo-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px}
.repo-title svg{fill:var(--muted)}
.repo-title .owner{color:var(--accent);font-weight:400}
.repo-title .slash{color:var(--muted)}
.repo-title b{font-weight:600}
.tabs{display:flex;gap:8px;margin-top:16px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab svg{fill:currentColor}
.tab.on{color:var(--fg);font-weight:600;border-bottom-color:var(--tab)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;padding:24px 0 64px;align-items:start}
.detail > *{min-width:0}
.about{position:sticky;top:80px}
.about h3{font-size:14px;font-weight:600;margin-bottom:8px}
.about p{font-size:14px;color:var(--muted);margin-bottom:16px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.topic{background:var(--chip-bg);color:var(--accent);border-radius:2em;padding:0 10px;font-size:12px;line-height:22px;font-weight:500}
.about-rows{border-top:1px solid var(--border);padding-top:12px;display:grid;gap:8px}
.about-rows div{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.about-rows svg{fill:var(--muted);flex:none;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 20px}
.badge{display:inline-flex;border-radius:3px;overflow:hidden;font-family:var(--mono);font-size:11px;line-height:20px;font-weight:600}
.badge b{background:#3f4550;color:#fff;padding:0 7px;font-weight:600}
.badge i{padding:0 7px;font-style:normal;color:#fff}
.readme-h1{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:600;padding-bottom:.3em;border-bottom:1px solid var(--border);margin-bottom:4px}
.readme-h1 svg{fill:var(--muted);flex:none}
.readme-sub{font-size:14px;color:var(--muted);margin-top:8px}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0 8px}
.shot{margin:0;min-width:0}
.shot.wide{grid-column:1/-1}
.shot-btn{display:block;width:100%;padding:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--subtle);cursor:zoom-in;line-height:0}
.shot-btn:hover{border-color:var(--muted)}
.shot-btn img{width:100%;height:auto;display:block}
.shot figcaption{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
.shot-note{font-size:12px;color:var(--muted);margin:8px 0 0;padding-left:2px}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:32px;padding-top:16px;border-top:1px solid var(--border);font-size:13px}
.pager a{display:inline-flex;gap:6px;align-items:center;max-width:48%}
.pager .lbl{color:var(--muted);display:block;font-size:11px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:20px 0 0}
.back svg{fill:currentColor}
.back:hover{color:var(--accent)}

/* ---------- lightbox ---------- */
dialog#lb{width:92vw;max-width:1280px;height:86vh;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--canvas);color:var(--fg);box-shadow:var(--shadow)}
dialog#lb::backdrop{background:rgba(1,4,9,.75)}
:root[data-theme="light"] dialog#lb::backdrop{background:rgba(31,35,40,.55)}
.lb-bar{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--subtle);height:48px}
.lb-cap{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer}
.icon-btn:hover{background:var(--btn-hover);border-color:var(--border)}
.icon-btn svg{fill:var(--fg)}
.lb-stage{position:relative;height:calc(86vh - 48px);display:grid;place-items:center;padding:16px 56px;background:var(--inset)}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:4px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--canvas);display:grid;place-items:center;cursor:pointer}
.lb-nav:hover{background:var(--btn-hover)}
.lb-nav svg{fill:var(--fg)}
.lb-nav.prev{left:10px}
.lb-nav.next{right:10px}
.lb-nav[hidden]{display:none}

/* ---------- footer ---------- */
footer.site{border-top:1px solid var(--border);padding:24px 0 40px;font-size:12px;color:var(--muted)}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center}

@media (max-width:1012px){
  .profile{grid-template-columns:1fr;gap:16px}
  .side{position:static}
  .avatar{width:140px}
  .name{margin-top:12px}
  .detail{grid-template-columns:1fr}
  .about{position:static;order:-1;border:1px solid var(--border);border-radius:6px;padding:16px}
  .box-body{padding:20px}
}
@media (max-width:768px){
  .wrap{padding:0 16px}
  .pins{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .avatar{width:110px}
  .name{font-size:22px}
  .repo-row{flex-direction:column;gap:4px}
  .rr-side{padding-top:0}
  .lb-stage{padding:12px 44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media print{
  .topbar,.filters,.pager,dialog#lb{display:none!important}
  .profile,.detail{grid-template-columns:1fr}
}
</style>
</head>

<script>
"use strict";

function mi(y, m){ return (y - 2010) * 12 + (m - 1); }
function pad2(n){ return n < 10 ? '0' + n : String(n); }
function endOf(r){ return r.to || NOW; }
function langDot(lang){
  return '<span class="lang"><span class="dot" style="background:' + LANG_COLOR[lang] + '"></span>' + lang + '</span>';
}
function periodShort(r){
  var a = r.from, b = endOf(r);
  var head = a[0] + '.' + pad2(a[1]);
  var tail = r.to ? (b[0] + '.' + pad2(b[1])) : '현재';
  return head + ' — ' + tail;
}
function shots(r){
  if (!r.imgs || !r.imgs.length) return '';
  var items = r.imgs.map(function(im, i){
    var wide = im.w > im.h;
    return '<figure class="shot' + (wide ? ' wide' : '') + '">' +
      '<button class="shot-btn" type="button" data-slug="' + r.slug + '" data-i="' + i + '" aria-label="' + esc(im.cap) + ' 크게 보기">' +
      '<img src="' + SRC + im.f + '" width="' + im.w + '" height="' + im.h + '" alt="' + esc(im.alt) + '" loading="lazy" decoding="async">' +
      '</button><figcaption>' + esc(im.cap) + '</figcaption></figure>';
  }).join('');
  return '<div class="shots">' + items + '</div>' +
    (r.imgNote ? '<p class="shot-note">' + esc(r.imgNote) + '</p>' : '');
}

function pinCard(r){
  var strip = '';

    strip = '<div class="strip' + (use.length === 1 ? ' one' : '') + '" aria-hidden="true">' +
      use.map(function(im){
        return '<img src="' + SRC + im.f + '" width="' + im.w + '" height="' + im.h + '" alt="" loading="lazy" decoding="async">';
      }).join('') + '</div>';
  }
  return '' +
  '<article class="pin">' +
    '<div class="pin-body">' +
      '<div class="pin-top">' + svg('repo') +
        '<a class="pin-name" href="#/repo/' + r.slug + '">' + r.name + '</a>' +
        '<span class="chip">Public</span>' +
      '</div>' +
      '<p class="pin-desc">' + esc(r.one) + '</p>' +
      '<div class="pin-foot">' + langDot(r.lang) + '<span>' + esc(r.period) + '</span></div>' +
    '</div>' + strip +
  '</article>';
}

function pinnedHtml(){
  var cards = PINNED.map(function(s){ return pinCard(BY_SLUG[s]); }).join('');

    '<div class="pins">' + cards + '</div></section>';
}

function heatmapHtml(){
  var TOTAL = 17 * 12;
  var brk = TENURES.map(function(t){
    var i0 = mi(t.a[0], t.a[1]), i1 = mi(t.b[0], t.b[1]);
    var left = (i0 / TOTAL) * 100;
    var w = ((i1 - i0 + 1) / TOTAL) * 100;
    return '<div class="brk r' + t.row + '" style="left:' + left.toFixed(3) + '%;width:' + w.toFixed(3) + '%" title="' + esc(t.name) + '">' +
      '<span>' + esc(t.label) + '</span></div>';
  }).join('');

  var head = '<div class="hm-m" aria-hidden="true"></div>';
  for (var y = 2010; y <= 2026; y++) head += '<div class="hm-y">' + y + '</div>';

  var body = '';
  for (var m = 1; m <= 12; m++) {
    body += '<div class="hm-m">' + m + '월</div>';
    for (var yy = 2010; yy <= 2026; yy++) {
      var idx = mi(yy, m);
      var names = [], intern = false;
      for (var k = 0; k < REPOS.length; k++) {
        var r = REPOS[k];
        var e = endOf(r);
        if (idx >= mi(r.from[0], r.from[1]) && idx <= mi(e[0], e[1])) {
          names.push(r.full.split(' — ')[0]);
          if (r.intern) intern = true;
        }
      }
      var lvl = 0;
      if (names.length === 1 && intern) lvl = 1;
      else if (names.length > 0) lvl = Math.min(4, names.length + 1);
      var tip = yy + '.' + pad2(m) + ' · ' + (names.length ? names.join(' · ') : '기록 없음');
      body += '<div class="cell' + (lvl ? ' l' + lvl : '') + '" title="' + esc(tip) + '"></div>';
    }
  }

  var legend = '';
  for (var L = 0; L <= 4; L++) legend += '<span class="cell' + (L ? ' l' + L : '') + '"></span>';

  return '' +
  '<section class="sec">' +
    '<div class="sec-head"><h2>15 Years of Shipping</h2><span class="hint">2010.09 — 2026.08</span></div>' +
    '<div class="box"><div class="box-body">' +
      '<div class="hm-scroll"><div class="hm">' +
        '<div class="brackets">' + brk + '</div>' +
        '<div class="hm-grid" role="img" aria-label="2010년부터 2026년까지 월별 프로젝트 진행 현황 히트맵">' + head + body + '</div>' +
        '<div class="hm-legend"><span>Less</span>' + legend + '<span>More</span></div>' +
      '</div></div>' +
      '<p class="hm-note">칸 하나는 한 달입니다. 같은 달에 동시에 진행한 프로젝트가 많을수록 짙게 표시했습니다. 각 칸에 마우스를 올리면 해당 월의 프로젝트를 볼 수 있습니다.</p>' +
    '</div></div>' +
  '</section>';
}

/* ============================ repo view ============================ */
function readableOn(hex){
  var c = hex.replace('#', '');
  var v = [0, 2, 4].map(function(i){
    var x = parseInt(c.substr(i, 2), 16) / 255;
    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  });
  var L = 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  return (1.05 / (L + 0.05)) >= 4.5 ? '#ffffff' : '#0d1117';
}
function badge(label, value, color){
  return '<span class="badge"><b>' + esc(label) + '</b>' +
    '<i style="background:' + color + ';color:' + readableOn(color) + '">' + esc(value) + '</i></span>';
}

  var work = r.work.map(function(w){ return '<li>' + w + '</li>'; }).join('');

    ? '<h3>📈 성과</h3><ul class="bullets">' + r.results.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'
    : '';

  var pager =
    '<div class="pager">' +
      (prev ? '<a href="#/repo/' + prev.slug + '">' + svg('cl') + '<span><span class="lbl">이전 저장소</span>' + prev.name + '</span></a>' : '<span></span>') +
      (next ? '<a href="#/repo/' + next.slug + '" style="text-align:right"><span><span class="lbl">다음 저장소</span>' + next.name + '</span>' + svg('cr') + '</a>' : '<span></span>') +
    '</div>';

  document.getElementById('app').innerHTML = '' +
  '<div class="repo-head">' +
    '<div class="repo-title">' + svg('repo') +
      '<a class="owner" href="#/">returnzero76</a><span class="slash">/</span><b>' + r.name + '</b>' +
      '<span class="chip">Public</span>' +
    '</div>' +
    '<nav class="tabs" aria-label="저장소 탭">' +
      '<span class="tab">' + svg('code') + 'Code</span>' +
      '<span class="tab on" aria-current="page">' + svg('book') + 'README</span>' +
      '<span class="tab">' + svg('clock') + esc(r.period) + '</span>' +
    '</nav>' +
  '</div>' +
  '<div class="detail">' +
    '<div class="md">' +
      '<h1 class="readme-h1">' + svg('repo', 22) + esc(r.full) + '</h1>' +
      '<p class="readme-sub">' + esc(r.company) + ' · ' + esc(r.period) + '</p>' +
      '<div class="badges">' +
        badge('stack', r.stack, '#1a5fb4') +
        badge('platform', r.platform, '#5a3fa0') +
        badge('period', r.period, '#1a7f37') +
        badge('lang', r.lang, LANG_COLOR[r.lang]) +
      '</div>' +
      '<p>' + esc(r.desc) + '</p>' +
      shots(r) +
      '<h3>🔧 주요 작업</h3><ul class="bullets">' + work + '</ul>' +
      results +
      pager +
      '<a class="back" href="#/">' + svg('al') + 'returnzero76 프로필로 돌아가기</a>' +
    '</div>' +
    '<aside class="about">' +
      '<h3>About</h3>' +
      '<p>' + esc(r.one) + '</p>' +
      '<div class="topics">' + topics + '</div>' +
      '<div class="about-rows">' +
        '<div>' + svg('bldg') + '<span>' + esc(r.company) + '</span></div>' +
        '<div>' + svg('clock') + '<span>' + esc(r.period) + '</span></div>' +
        '<div><span class="lang"><span class="dot" style="background:' + LANG_COLOR[r.lang] + '"></span>' + r.lang + '</span></div>' +
      '</div>' +
    '</aside>' +
  '</div>';

  document.title = r.name + ' · 강지환 — Resume';
  document.getElementById('crumb-repo').textContent = r.name;
}

/* ============================ filters ============================ */
function bindFilters(){
  var host = document.querySelector('.filters');
  if (!host) return;
  host.addEventListener('click', function(ev){
    var b = ev.target.closest('.fchip');
    if (!b) return;
    var key = b.getAttribute('data-f');
    Array.prototype.forEach.call(host.querySelectorAll('.fchip'), function(c){
      c.setAttribute('aria-pressed', c === b ? 'true' : 'false');
    });
    var shown = 0;
    Array.prototype.forEach.call(document.querySelectorAll('#repo-list .repo-row'), function(row){
      var cats = (row.getAttribute('data-cats') || '').split(' ');
      var on = key === 'all' || cats.indexOf(key) > -1;
      row.hidden = !on;
      if (on) shown++;
    });
    document.getElementById('repo-empty').hidden = shown > 0;
  });
}

/* ============================ lightbox ============================ */
var lb = document.getElementById('lb');
var lbImg = document.getElementById('lb-img');
var lbCap = document.getElementById('lb-cap');
var lbCount = document.getElementById('lb-count');
var lbPrev = document.getElementById('lb-prev');
var lbNext = document.getElementById('lb-next');
var lbClose = document.getElementById('lb-close');
lbClose.innerHTML = svg('x');
lbPrev.innerHTML = svg('cl');
lbNext.innerHTML = svg('cr');

var LB = { list: [], i: 0, opener: null };

function lbShow(){
  var im = LB.list[LB.i];
  if (!im) return;
  var base = SRC + im.f;
  lbImg.alt = im.alt;
  lbImg.removeAttribute('width');
  lbImg.removeAttribute('height');
  if (/\.svg$/i.test(im.f)) {
    lbImg.onerror = null;
    lbImg.src = base;
  } else {
    lbImg.onerror = function(){ lbImg.onerror = null; lbImg.src = base; };
    lbImg.src = SRC + 'full/' + im.f;
  }
  lbCap.textContent = im.cap;
  lbCount.textContent = (LB.i + 1) + ' / ' + LB.list.length;
  var multi = LB.list.length > 1;
  lbPrev.hidden = !multi;
  lbNext.hidden = !multi;
}
function lbOpen(slug, i, opener){
  var r = BY_SLUG[slug];
  if (!r || !r.imgs.length) return;
  LB.list = r.imgs;
  LB.i = i;
  LB.opener = opener;
  lbShow();
  if (typeof lb.showModal === 'function') lb.showModal(); else lb.setAttribute('open', '');
  document.body.style.overflow = 'hidden';
  lbClose.focus();
}
function lbStep(d){
  if (LB.list.length < 2) return;
  LB.i = (LB.i + d + LB.list.length) % LB.list.length;
  lbShow();
}
lbClose.addEventListener('click', function(){ lb.close(); });
lbPrev.addEventListener('click', function(){ lbStep(-1); });
lbNext.addEventListener('click', function(){ lbStep(1); });
lb.addEventListener('click', function(ev){ if (ev.target === lb) lb.close(); });
lb.addEventListener('cancel', function(){ /* Esc closes; handled by close event */ });
lb.addEventListener('close', function(){
  document.body.style.overflow = '';
  lbImg.removeAttribute('src');
  if (LB.opener && document.contains(LB.opener)) LB.opener.focus();
  LB.opener = null;
});
document.addEventListener('keydown', function(ev){
  if (!lb.open) return;
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); lbStep(-1); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); lbStep(1); }
});
document.getElementById('app').addEventListener('click', function(ev){
  var b = ev.target.closest('.shot-btn');
  if (!b) return;
  ev.preventDefault();
  lbOpen(b.getAttribute('data-slug'), parseInt(b.getAttribute('data-i'), 10), b);
});

/* ============================ theme ============================ */
var themeBtn = document.getElementById('theme-btn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  var dark = t === 'dark';
  document.getElementById('theme-icon').innerHTML = svg(dark ? 'sun' : 'moon', 14);
  document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';
  themeBtn.setAttribute('aria-label', dark ? 'Light 모드로 전환' : 'Dark 모드로 전환');
}
themeBtn.addEventListener('click', function(){
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('resume-v11-theme', next); } catch (e) {}
  applyTheme(next);
});
(function(){
  var saved = null;
  try { saved = localStorage.getItem('resume-v11-theme'); } catch (e) {}
  applyTheme(saved === 'light' ? 'light' : 'dark');
})();

/* ============================ router ============================ */
function route(){
  if (lb.open) lb.close();
  var h = location.hash.replace(/^#/, '');
  var m = h.match(/^\/repo\/([a-z0-9-]+)$/i);
  if (m && BY_SLUG[m[1]]) renderRepo(BY_SLUG[m[1]]);
  else renderProfile();
  window.scrollTo(0, 0);
  var app = document.getElementById('app');
  app.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
route();
</script>
